[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public tokenizer artifact SHA-256 values, not API tokens"
condition = "AND"
paths = ['''(^|/)internal/assets/manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tokenizer\.json": "[a-f0-9]{64}",?\s*$''']

[[rules.allowlists]]
description = "Pinned public Model2Vec tokenizer checksum in reference/result metadata"
condition = "AND"
paths = ['''(^|/)experiments/static-embedding/(reference|results-04)\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(tokenizer_sha256|TokenizerSHA256)": "e67e803f624fb4d67dea1c730d06e1067e1b14d830e2c2202569e3ef0f70bb50",?\s*$''']

[[rules.allowlists]]
description = "Exact already-public Laya tokenizer SHA-256 in bounded relevance probe"
condition = "AND"
paths = ['''(^|/)cmd/riido-layaprobe/main\.go$''']
regexTarget = "secret"
regexes = ['''^6c8aaa9a542084f2457eab775d4eeb51f92a70c0fd9de28d5edb0ddec3c08d30$''']

[[rules.allowlists]]
description = "Exact public Laya tokenizer checksum in parity asset pins"
condition = "AND"
paths = ['''(^|/)experiments/laya-parity/assets-18\.json$''']
regexTarget = "secret"
regexes = ['''^6c8aaa9a542084f2457eab775d4eeb51f92a70c0fd9de28d5edb0ddec3c08d30$''']

# This exact public checksum is already pinned in internal/assets/manifest.json.
# Preserve existing rules and allowlists; only this field/value in plan 50 matches.
[[rules.allowlists]]
description = "Exact public base tokenizer SHA-256 in plan 50"
condition = "AND"
paths = ['''^experiments/task-outcomes/plan-50\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tokenizer_sha256":\s*"6c8aaa9a542084f2457eab775d4eeb51f92a70c0fd9de28d5edb0ddec3c08d30"\s*,?\s*$''']

[[rules.allowlists]]
description = "Exact public base tokenizer file checksum in plan 51"
condition = "AND"
paths = ['''^experiments/task-outcomes/plan-51\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tokenizer\.json":\s*"6c8aaa9a542084f2457eab775d4eeb51f92a70c0fd9de28d5edb0ddec3c08d30"\s*,?\s*$''']

[[rules.allowlists]]
description = "Exact public source Git revision for the versioned event-envelope task"
condition = "AND"
paths = ['''^internal/taskverify/definition_event_keys_v1\.go$''']
regexTarget = "line"
regexes = ['''^\s*const eventKeyBoundsRevision = "ee72334166e2962b0821d5198a50fdd13f92ab29"\s*$''']

[[rules.allowlists]]
description = "Authored invalid-key-boundary case labels, not credentials"
condition = "AND"
paths = ['''^internal/taskverify/definition_event_keys_v1_test\.go$''']
regexTarget = "secret"
regexes = ['''^key127-strict$''']

[[rules.allowlists]]
description = "Exact already-public event-envelope TaskSpec SHA in immutable regression vector"
condition = "AND"
paths = ['''^internal/taskverify/upstream_v2_test\.go$''']
regexTarget = "secret"
regexes = ['''^169cedefd41d3a5ba05d11bbb4685761a0dde6adf07401b846b77bf5a84c27db$''']

# Exact fictional JWT151 artifacts generated locally; no private key or live tokens.
[[rules.allowlists]]
description = "Exact public fictional token and API-response SHA values from the first JWT audit"
condition = "AND"
paths = ['''^experiments/short-claim/next-cohort-jwt-audit/(SIGNER-STDOUT|EXECUTION)\.actual\.public\.v1\.json$''']
