# SHA-256 of the fictional public SPKI DER key already published in
# SIGNER-STDOUT.actual.public.v1.json; this value is not a credential.
[[rules.allowlists]]
description = "Exact public fictional JWT key checksum in the saved cost replay"
condition = "AND"
paths = ['''^experiments/short-claim/next-cohort-jwt-audit/cost-replay/main\.go$''']
regexTarget = "line"
regexes = ['''^\s*const keySHA = "6c6ef54b2b0fa9af5bb3db8b8280a132371a3733adb5068e8ed40efabbc8c92d"\s*$''']

