# Preserve every default secret rule. This is a public tokenizer checksum,
# already pinned under base.files["tokenizer.json"] in internal/assets/manifest.json.
# Match only that exact JSON field/value in the frozen public plan. Never ignore
# a commit, a whole file, token-shaped values, or other checksum values.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact public base tokenizer SHA-256 in plan 50"
condition = "AND"
paths = ['''^experiments/task-outcomes/plan-50\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tokenizer_sha256":\s*"6c8aaa9a542084f2457eab775d4eeb51f92a70c0fd9de28d5edb0ddec3c08d30"\s*,?\s*$''']
