[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public tokenizer artifact SHA-256 values, not API tokens"
condition = "AND"
paths = ['''(^|/)internal/assets/manifest\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tokenizer\.json": "[a-f0-9]{64}",?\s*$''']

[[rules.allowlists]]
description = "Pinned public Model2Vec tokenizer checksum in reference/result metadata"
condition = "AND"
paths = ['''(^|/)experiments/static-embedding/(reference|results-04)\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(tokenizer_sha256|TokenizerSHA256)": "e67e803f624fb4d67dea1c730d06e1067e1b14d830e2c2202569e3ef0f70bb50",?\s*$''']
