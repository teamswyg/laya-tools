name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go test -race ./... && go vet ./...
      - name: Build and exercise native inference
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=$TAG" -o riidolaya ./cmd/riidolaya
          ./riidolaya setup
          ./riidolaya bench --iterations 3
          tar -czf "riidolaya-$TAG-$TARGET.tar.gz" riidolaya LICENSE NOTICE licenses
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: riidolaya-${{ matrix.target }}
          path: riidolaya-*.tar.gz
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$TAG" *.tar.gz SHA256SUMS --verify-tag --title "$TAG" --generate-notes
