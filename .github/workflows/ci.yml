name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Format owned Go sources; preserve immutable upstream fixture bytes
        shell: bash
        run: |
          set -euo pipefail
          format_report=$(git ls-files -z '*.go' ':!:**/testdata/**' | xargs -0 gofmt -l)
          test -z "$format_report"
      - name: Reproduce finite development data (offline Go; no training)
        run: bash scripts/verify-next60-development.sh data
      - name: Authored observation controller tests (fake processes only)
        if: runner.os == 'macOS'
        run: bash scripts/verify-next60-development.sh controller
      - name: Durable observation checkpoints (synthetic callbacks only)
        run: bash scripts/verify-next60-development.sh checkpoint
      - name: Four-task outside controller (fake lifecycle and metadata only)
        run: bash scripts/verify-next60-development.sh outside
      - name: Nine-task controller and comparator (synthetic controls; no worker launch)
        run: bash scripts/verify-next60-development.sh catalog9
      - name: Sixteen-row materializer and validator (synthetic controls only)
        run: bash scripts/verify-next60-development.sh sixteen
      - name: Five-task controls and saved finite observations (no worker launch)
        run: bash scripts/verify-next60-development.sh five
      - name: Twenty-one-row data controls (synthetic only; no training)
        run: bash scripts/verify-next60-development.sh twentyone
      - name: Two-task saved finite comparisons (no original worker launch)
        run: bash scripts/verify-next60-extra-two.sh
      - name: Twenty-three-row exact data and project reader correspondence (no training)
        run: bash scripts/verify-next60-twentythree.sh
      - name: INI saved comparer failure controls (synthetic only; no original replay)
        run: bash scripts/verify-next60-ini-two.sh
      - name: Thirty-row reproduction, actual reader and owned failure controls (offline; no training)
        run: bash scripts/verify-next60-thirty.sh
      - name: Thirty-three-row data, full reader values and saved predicate reproduction (offline; no training)
        run: bash scripts/verify-next60-thirtythree.sh
      - name: Thirty-five-row full data and saved GJSON reproduction (offline; no worker or training)
        run: bash scripts/verify-next60-thirtyfive.sh
      - name: Recoverable archive helper controls (owned temporary fixtures only)
        run: bash experiments/short-claim/publication-proof-126/archive-source/verify.sh
      - name: Generic leaf archive and unknown-aware Golden Reader controls (owned synthetic inputs; no training)
        run: bash scripts/verify-next60-source-controls.sh
      - name: Masked sparse learning columns and actual Go loss controls (synthetic inputs; no training)
        run: bash scripts/verify-next60-mask-learning.sh
      - name: Bounded next-case wire, durable ACK and file drift controls (owned fakes; no worker)
        run: bash scripts/verify-next60-union-preparation.sh
      - name: Lossless compact evidence and native marker controls (owned fakes; no inference)
        run: bash scripts/verify-next60-compact-evidence.sh
      - name: Wire3 evidence files and durable verification pipeline (owned fakes only)
        run: bash scripts/verify-next60-durable-evidence.sh
      - name: Cache reset, worker lifecycle and saved semantic controls (owned fakes only)
        run: bash scripts/verify-next60-native-wire3.sh
      - name: Qualified finite37 saved materialization and project Reader (no training)
        run: bash scripts/verify-next60-thirtyseven.sh
      - name: Nonlearned37 paired ordering and bias diagnostic (Go; no model or Fit)
        env:
          RIIDOLAYA_BIAS37_ACTUAL: ${{ runner.temp }}/riidolaya-bias37-actual/actual.json
        run: bash scripts/verify-next60-bias37.sh
      - name: Bounded xxhash next-cohort audit (offline Go CPU; one parent, no training)
        run: bash experiments/short-claim/next-cohort-xxhash-audit/verify.sh
      - name: Saved xxhash hint counterexample (offline Go; no model read or training)
        run: bash experiments/short-claim/next-cohort-xxhash-audit/posthoc-hint-preview/verify.sh
      - name: Saved actual packed costs (offline Go; no model or raw profile read)
        run: bash experiments/short-claim/next-cohort-xxhash-audit/packed-real-preview/verify.sh
      - name: Saved caller-owned prepared features (offline Go; no model or training)
        run: bash experiments/short-claim/next-cohort-xxhash-audit/prepared-storage-preview/verify.sh
      - name: Prepared input and buffer contracts (synthetic numeric weights; no learned model or training)
        run: bash experiments/short-claim/next-cohort-xxhash-audit/prepared-contract-preview/verify.sh
      - name: Actual pinned Chi route replay (offline Go CPU; one parent, no model or training)
        run: go run ./experiments/short-claim/next-cohort-chi-audit/replay
      - name: Actual pinned Decimal conversion replay (offline Go CPU; one exposed parent, no model or training)
        run: go run ./experiments/short-claim/next-cohort-decimal-audit/replay
      - name: Saved Chi paired costs and complete call traces (offline Go; no new worker or model calls)
        run: bash scripts/verify-chi-saved-cost.sh
      - name: Saved Chi setup reuse costs (offline Go; no model calls or profiling)
        run: |
          (cd experiments/short-claim/next-cohort-chi-audit/setup-reuse && shasum -a 256 -c SHA256SUMS)
          evidence=$(mktemp)
          trap 'rm -f "$evidence"' EXIT
          gzip -dc experiments/short-claim/next-cohort-chi-audit/setup-reuse/OBSERVATIONS.actual.public.v1.json.gz > "$evidence"
          go run ./experiments/short-claim/next-cohort-chi-audit/setup-reuse -saved "$evidence"
      - name: Saved constructor scratch costs and independent public feature witness (Go; no model or training)
        run: |
          (cd experiments/short-claim/next-cohort-chi-audit/constructor-scratch && shasum -a 256 -c SHA256SUMS)
          go test ./pkg/hintprepared -run '^TestConstructorSaved$' -count=1 -v -constructor-saved "$GITHUB_WORKSPACE/experiments/short-claim/next-cohort-chi-audit/constructor-scratch/OBSERVATIONS.actual.public.v1.json.gz"
      - name: Saved shared-token costs and synthetic source controls (Go; no model or new measurement)
        run: bash scripts/verify-chi-token-plan.sh
      - name: Btree finite contracts, nullable training rows and CPU semantic replay (offline; no model or Fit)
        env:
          RIIDOLAYA_BTREE_FRESH: ${{ runner.temp }}/riidolaya-btree-fresh/fresh.json
        run: bash scripts/verify-btree-utility.sh replay
      - name: Raw symbol and relation preview against exposed saved labels (Go; no model or training)
        env:
          RIIDOLAYA_REPRESENTATION_CAPTURE: ${{ runner.temp }}/riidolaya-representation-first/first.json.gz
        run: |
          mkdir -p "$(dirname "$RIIDOLAYA_REPRESENTATION_CAPTURE")"
          bash scripts/verify-text-representations.sh
      - name: Saved first JWT observations and synthetic boundary controls (offline Go; no new native API or training)
        run: bash scripts/verify-jwt-native-audit.sh
      - name: Saved JWT cache costs and synthetic ownership controls (no new native observation or training)
        run: bash scripts/verify-jwt-cost-preview.sh
      - name: Preserve first representation preview responses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: representations-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/riidolaya-representation-first/*
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve first Btree replay and platform differences
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btree149-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/riidolaya-btree-fresh/*
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve actual nonlearned37 scores and matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bias37-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/riidolaya-bias37-actual/actual.json
          if-no-files-found: warn
      - name: Variable Go input controls and frozen nonlearned33 ranking reproduction (no training)
        env:
          RIIDOLAYA_BIAS_ACTUAL: ${{ runner.temp }}/riidolaya-bias-actual/actual.json
        run: |
          mkdir -p "$(dirname "$RIIDOLAYA_BIAS_ACTUAL")"
          bash scripts/verify-next60-learning-preparation.sh
      - name: Preserve actual nonlearned ranking and platform differences
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bias33-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/riidolaya-bias-actual/actual.json
            ${{ runner.temp }}/riidolaya-bias-actual/actual.json.diff.json
          if-no-files-found: warn
          retention-days: 14
      # The suite runs multiple cold isolated compilers. This outer budget does
      # not change any candidate's verifier timeout, sandbox or acceptance gate.
      - run: go test -race -timeout=20m ./...
      - run: go vet ./...
      - name: Maintainer publication guards (offline, no training dependencies)
        run: python3 -m unittest discover -s scripts/training -p test_publication.py
      - name: Frozen PDCA plan and family boundaries (offline)
        run: python3 -m unittest discover -s scripts/training -p "test_pdca_*.py"
      - name: Policy packages have no native runtime dependency
        run: CGO_ENABLED=0 go test ./pkg/...
      - name: Bounded short-claim preview (Go CPU, no encoder)
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/riido-shortclaim ./cmd/riido-shortclaim
          ./bin/riido-shortclaim --baseline lexical_ordered < examples/shortclaim/order.json
          ./bin/riido-shortclaim --baseline narrow_rule < examples/shortclaim/rule.json
      - run: go build -trimpath -o bin/riidolaya ./cmd/riidolaya
      - name: Static embedding source and Go parity (CPU, no Python runtime)
        shell: bash
        run: |
          go run ./cmd/riido-staticprobe --stage setup --model-dir .cache/static-test-model
          RIIDO_STATIC_MODEL_DIR="$PWD/.cache/static-test-model" CGO_ENABLED=0 go test -count=1 -v ./internal/staticembed ./internal/alignment
          RIIDO_STATIC_MODEL_DIR="$PWD/.cache/static-test-model" go test -race -count=1 ./internal/staticembed ./internal/alignment
      - name: Install verified public runtime and checkpoint
        run: ./bin/riidolaya setup
      - name: Native inference and reference tokenizer parity
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            export LAYA_MODEL_DIR="$HOME/Library/Caches/laya-tools/base"
            export LAYA_RUNTIME="$HOME/Library/Caches/laya-tools/runtime/libonnxruntime.1.30.0.dylib"
          else
            lscpu
            export LAYA_MODEL_DIR="$HOME/.cache/laya-tools/base"
            export LAYA_RUNTIME="$HOME/.cache/laya-tools/runtime/libonnxruntime.so.1.30.0"
          fi
          go test -count=1 -v ./internal/inference
          ./bin/riidolaya bench --iterations 3
          ./bin/riidolaya repo-preview --catalog examples/repositories/catalog.json --laya --json "refund invoices"
      - run: ./bin/riidolaya search --lexical --json --root . 'routing confidence'
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 git --redact --no-banner
  quality:
    if: always()
    needs: [test, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SECRET_RESULT: ${{ needs.secrets.result }}
        run: test "$TEST_RESULT" = success && test "$SECRET_RESULT" = success
